<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psita - Início</title>
    <link rel="stylesheet" href="style-aluno.css">
    <script src="interface-aluno.js" defer></script>
    <script src="correio-aluno.js" defer></script>
    <link rel="icon" href="assets/logos/favicon.png" type="favicon/png" sizes="32x32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <aside class="sidebar">
        <div class="topo-sidebar">

            <img src="assets/logos/logo.png" alt="Psita" class="logo-sidebar">

            <div id="botao-menu" class="botao-menu">☰</div>
        </div>

        <nav class="menu-lateral">

            <a href="#">
                <span class="icone flag"> <i class="fa-solid fa-house"></i> </span>
                <span class="texto flag">INÍCIO</span>
            </a>

            <a href="#">
                <span class="icone"> <i class="fa-solid fa-graduation-cap"></i> </span>
                <span class="texto">ACADÊMICO</span>
            </a>

            <a href="#">
                <span class="icone"> <i class="fa-solid fa-id-card"></i> </span>
                <span class="texto">MATRÍCULA</span>
            </a>

            <a href="#">
                <span class="icone"> <i class="fa-solid fa-wrench"></i> </span>
                <span class="texto">SERVIÇOS</span>
            </a>

            <a href="#">
                <span class="icone"> <i class="fa-solid fa-circle-user"></i> </span>
                <span class="texto">PERFIL</span>
            </a>

        </nav>
    </aside>


    <main class="conteudo-principal">

        <header class="container-cabecalho">
            <h1 class="texto-main"> Curso: EX: Análise e desenvolvimento de sistemas</h1>
            <h2 class="texto-main"> Olá, EX: Alexandre Ferreira</h2>
        </header>

        <div class="Linha1-de-cards">

            <!-- Card 1 -->
            <div class="correio-inicio">
                <h1 class="texto-correio">Correio</h1>

                <div class="container-mensagens">

                    <!-- Lado Esquerdo (lista de mensagens com data, hora e assunto) -->
                    <div class="lista-mensagens" id="caixa-de-entrada">

                    </div>

                    <!-- Lado Direito (onde a mensagem sera lida de fato) -->
                    <div class="leitura-mensagem" id="tela-leitura">
                        <p style="color: #9CA3AF; text-align: center; margin-top: 50px;">
                            Selecione uma mensagem para ler.
                        </p>
                    </div>

                </div>
            </div>

            <!-- Card 2 -->
            <div class="grafico-conclusao">
                <h1 class="texto-correio" style="text-align: center; margin-bottom: 20px;">Progresso</h1>

                <div class="container-grafico">

                    <div class="anel-progresso" id="grafico-curso">
                        <span class="valor-progresso" id="valor-curso">0%</span>
                    </div>

                    <div class="legenda-detalhada">

                        <div class="item-legenda">
                            <div class="grupo-legenda">
                                <span class="cor-bolinha cor-cursadas"></span>
                                <span class="texto-legenda">Disciplinas cursadas</span>
                            </div>

                            <strong id="qtd-cursadas">0</strong>
                        </div>

                        <div class="item-legenda">
                            <div class="grupo-legenda">
                                <span class="cor-bolinha cor-cursando"></span>
                                <span class="texto-legenda">Disciplinas cursando</span>
                            </div>
                            <strong id="qtd-cursando">0</strong>
                        </div>

                        <div class="item-legenda">
                            <div class="grupo-legenda">
                                <span class="cor-bolinha cor-pendentes"></span>
                                <span class="texto-legenda">Disciplinas pendentes</span>
                            </div>
                            <strong id="qtd-pendentes">0</strong>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <!-- Card 3 -->
        <div class="grade-resumo">
            <h1 class="texto-correio" style="text-align: left; margin-bottom: 20px;">Grade horária</h1>


        </div>

    </main>

</body>




</html>
